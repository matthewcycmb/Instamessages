<!doctype html>
<!-- The launch splash. The webview starts here, painted from disk on the very
     first frame, then immediately navigates to instagram.com - which takes a
     network round-trip before it has a document at all. Without this page that
     wait was a dead black window on every cold launch. CAGE_SCRIPT's boot
     overlay (visually identical, in lib.rs) takes over at instagram's
     document-start; keep the two in sync by eye if the brand changes. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Konvo</title>
<style>
  html, body { margin: 0; height: 100%; background: #000 }
  body { display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 18px }
  .w { font: 600 17px -apple-system, system-ui, sans-serif; color: #f5f5f7;
       letter-spacing: -0.01em }
  .s { width: 20px; height: 20px; border: 2px solid #2c2c2e;
       border-top-color: #0a84ff; border-radius: 50%;
       animation: spin .8s linear infinite }
  @keyframes spin { to { transform: rotate(360deg) } }
</style>
<svg width="62" height="62" viewBox="0 0 512 512" aria-hidden="true">
  <rect width="512" height="512" rx="116" fill="#0a84ff"/>
  <g transform="translate(70,70) scale(15.5)" fill="none" stroke="#fff"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
  </g>
</svg>
<div class="w">Konvo</div>
<div class="s"></div>
<script>location.replace("https://www.instagram.com/direct/inbox/")</script>
